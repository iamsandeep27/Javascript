<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        label, input, button, p {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Simple Calculation of Two Numbers</h1>

    <label for="num1">Enter a number:</label>
    <input type="number" id="num1">

    <label for="num2">Enter another number:</label>
    <input type="number" id="num2">

    <button id="calculateBtn">Calculate</button>

    <h2>Results:</h2>
    <p>Addition: <span id="addition"></span></p>
    <p>Subtraction: <span id="subtraction"></span></p>
    <p>Multiplication: <span id="multiplication"></span></p>
    <p>Division: <span id="division"></span></p>

    <script>
        const num1Input = document.getElementById("num1");
        const num2Input = document.getElementById("num2");
        const additionOutput = document.getElementById("addition");
        const subtractionOutput = document.getElementById("subtraction");
        const multiplicationOutput = document.getElementById("multiplication");
        const divisionOutput = document.getElementById("division");
        const calculateBtn = document.getElementById("calculateBtn");

        calculateBtn.addEventListener("click", () => {
            const a = Number(num1Input.value);
            const b = Number(num2Input.value);

            additionOutput.textContent = a + b;
            subtractionOutput.textContent = a - b;
            multiplicationOutput.textContent = a * b;
            divisionOutput.textContent = b !== 0 ? (a / b).toFixed(2) : "Cannot divide by zero";
        });
    </script>
</body>
</html>
